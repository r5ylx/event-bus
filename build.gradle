plugins {
    id 'java-library'
    id 'maven-publish'
}

version = '1.0.0'
group = 'com.r5ylx'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform("org.junit:junit-bom:${junitVersion}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    withSourcesJar()
    withJavadocJar()
}

tasks.withType(JavaCompile).configureEach {
    // Uses release instead of a toolchain, so it never goes looking for a JDK and behaves the same everywhere.
    it.options.release = 21
    it.options.encoding = 'UTF-8'
    it.options.compilerArgs << '-Xlint:all' << '-Werror'
}

tasks.withType(Javadoc).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.addStringOption('Xdoclint:all,-missing', '-quiet')
}

test {
    useJUnitPlatform()

    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

// Apache 2.0 requires the full license text to be shipped with the distribution.
tasks.withType(Jar).configureEach {
    it.from(projectDir) {
        include 'LICENSE'
        into 'META-INF'
    }
}

// Makes the same input produce the same jar.
tasks.withType(AbstractArchiveTask).configureEach {
    it.preserveFileTimestamps = false
    it.reproducibleFileOrder = true
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java

            pom {
                name = 'event-bus'
                description = 'A small event bus that supports both annotations and lambdas.'
                licenses {
                    license {
                        name = 'The Apache License, Version 2.0'
                        url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                        distribution = 'repo'
                    }
                }
            }
        }
    }

    repositories {
        maven {

        }
    }
}