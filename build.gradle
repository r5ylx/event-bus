plugins {
    id 'java-library'
    id 'maven-publish'
}

version = '1.0.0'
group = 'com.r5ylx'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform("org.junit:junit-bom:${junitVersion}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    withSourcesJar()
    withJavadocJar()
}

tasks.withType(JavaCompile).configureEach {
    // toolchain ではなく release を使います。JDK を取りに行かないので、どの環境でも同じ結果になります。
    it.options.release = 21
    it.options.encoding = 'UTF-8'
    it.options.compilerArgs << '-Xlint:all' << '-Werror'
}

tasks.withType(Javadoc).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.addStringOption('Xdoclint:all,-missing', '-quiet')
}

test {
    useJUnitPlatform()

    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

// Apache 2.0 は配布物にライセンス全文を同梱することを求めています。
tasks.withType(Jar).configureEach {
    it.from(projectDir) {
        include 'LICENSE'
        into 'META-INF'
    }
}

// 同じ入力から同じ jar が出るようにします。
tasks.withType(AbstractArchiveTask).configureEach {
    it.preserveFileTimestamps = false
    it.reproducibleFileOrder = true
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java

            pom {
                name = 'events'
                description = 'アノテーションとラムダの両方に対応した、軽量なイベントバスです。'
                licenses {
                    license {
                        name = 'The Apache License, Version 2.0'
                        url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                        distribution = 'repo'
                    }
                }
            }
        }
    }

    repositories {
        maven {

        }   
    }
}